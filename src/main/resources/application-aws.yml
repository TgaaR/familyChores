logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    org.familychoregame: INFO
    org.jdbi: WARN
    org.springframework.web: INFO
server:
  servlet:
    session:
      cookie:
        secure: true
family-chore-game:
  database-url: ${FAMILY_CHORE_DB_URL}
  database-username: ${FAMILY_CHORE_DB_USERNAME}
  database-password: ${FAMILY_CHORE_DB_PASSWORD}
