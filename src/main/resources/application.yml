spring:
  application:
    name: family-chore-game
  jackson:
    default-property-inclusion: non_null
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{request_id:-}] %logger{36} - %msg %kvp%n%ex"
family-chore-game:
  database-url: ${FAMILY_CHORE_DB_URL:jdbc:postgresql://localhost:5432/family_chore_game}
  database-username: ${FAMILY_CHORE_DB_USERNAME:family_chore_game}
  database-password: ${FAMILY_CHORE_DB_PASSWORD:family_chore_game}
  timezone: Asia/Jerusalem
