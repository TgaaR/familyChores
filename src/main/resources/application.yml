spring:
  application:
    name: family-chore-game
  jackson:
    default-property-inclusion: non_null
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{request_id:-}] %logger{36} - %msg %kvp%n%ex"
family-chore-game:
  database-path: ${FAMILY_CHORE_DB:./data/family-chore-game.db}
  timezone: Asia/Jerusalem
