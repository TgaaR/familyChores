services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_chore_game
      POSTGRES_USER: family_chore_game
      POSTGRES_PASSWORD: family_chore_game
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - family-chore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_chore_game -d family_chore_game"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  family-chore-postgres:
